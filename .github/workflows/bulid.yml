name: Build Executable
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add MinGW to PATH
        run: echo "C:\ProgramData\mingw64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Compile
        run: gcc -O2 -s -mwindows layout_switch.c -o layout_switch.exe -luser32

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: layout_switch
          path: layout_switch.exe