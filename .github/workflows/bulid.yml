name: Build Executable
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: gcc -O2 -s -mwindows layout_switch.c -o layout_switch.exe -luser32
      - uses: actions/upload-artifact@v4
        with:
          name: layout_switch
          path: layout_switch.exe